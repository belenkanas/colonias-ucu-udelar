# Experimento mlca_v5_mlca
#   python -m colonias.train configs/experiments/mlca_v5_mlca.yaml
#   python -m colonias.evaluate configs/experiments/mlca_v5_mlca.yaml
nombre: mlca_v5_mlca
descripcion: YOLOv8m con los 4 C2f del neck -> C2f-MLCA, 3 seeds (colab_yolov8m_mlca.ipynb)
dataset: subdataset_v2_v5
variante: mlca
modelo: yolov8m.pt
seeds:
- 0
- 1
- 2
ultralytics_original: 8.4.163
entrenamiento:
  epochs: 100
  patience: 0
  batch: 32
  imgsz: 640
  optimizer: Adam
  lr0: 0.0001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0001
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  nbs: 64
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.15
  degrees: 12.0
  translate: 0.1
  scale: 0.1
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
  erasing: 0.4
  cos_lr: false
  deterministic: true
  amp: true
  iou: 0.7
  max_det: 300
  pretrained: true
  workers: 8
evaluacion:
  conf: 0.5
  iou_nms: 0.45
  especie_desde: nombre_archivo
resultado_informe: results/referencia/mlca_v5_colab.csv (seeds 0-2, Colab T4, batch 32)
