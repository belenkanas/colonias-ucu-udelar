# Experimento agar_mlca
#   python -m colonias.train configs/experiments/agar_mlca.yaml
#   python -m colonias.evaluate configs/experiments/agar_mlca.yaml
nombre: agar_mlca
descripcion: YOLOv8m + C2f-MLCA sobre el subdataset de AGAR (colab_yolov8m_mlca_AGAR.ipynb)
dataset: agar_subdataset_v1
variante: mlca
modelo: yolov8m.pt
seeds:
- 0
ultralytics_original: 8.4.163
entrenamiento:
  epochs: 100
  patience: 15
  batch: 32
  imgsz: 640
  optimizer: Adam
  lr0: 0.0001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0001
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  nbs: 64
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.15
  degrees: 12.0
  translate: 0.1
  scale: 0.1
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
  erasing: 0.4
  cos_lr: false
  deterministic: true
  amp: true
  iou: 0.7
  max_det: 300
  pretrained: true
  workers: 8
evaluacion:
  conf: 0.5
  iou_nms: 0.45
  especie_desde: etiquetas
notas: ~5 h en una T4 (74 épocas, early stopping; best en la época 59).
resultado_informe:
  val_mAP50: 0.963
  val_mAP50_95: 0.638
  val_especie: 0.968
  val_conteo_MAE: 1.647
  test_mAP50: 0.955
  test_mAP50_95: 0.617
  test_especie: 0.97
  test_conteo_MAE: 1.89
